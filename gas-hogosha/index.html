<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>学級だより</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --sub: #6b6b6b;
    --line: #e4e0d6;
    --accent: #2f7d5b;
    --accent-soft: #e3f1ea;
    --warn: #c2410c;
    --warn-soft: #fdebdd;
    --danger: #b91c1c;
    --danger-soft: #fde2e2;
    --new: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1d1f;
      --card: #26282b;
      --text: #ececec;
      --sub: #a3a3a3;
      --line: #3a3d41;
      --accent: #5cc195;
      --accent-soft: #23362d;
      --warn: #fb923c;
      --warn-soft: #3b2a1e;
      --danger: #f87171;
      --danger-soft: #3d2222;
      --new: #fbbf24;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 16px;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 20px 16px 16px;
  }
  header .school { font-size: 13px; opacity: .9; }
  header h1 { font-size: 22px; line-height: 1.4; }
  header .updated { font-size: 12px; opacity: .85; margin-top: 4px; }

  nav {
    position: sticky; top: 0; z-index: 10;
    display: flex;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  nav a {
    flex: 1;
    text-align: center;
    padding: 12px 4px;
    font-size: 14px;
    font-weight: bold;
    color: var(--sub);
    text-decoration: none;
  }
  nav a .count {
    display: inline-block;
    min-width: 20px;
    margin-left: 4px;
    padding: 0 6px;
    border-radius: 10px;
    background: var(--warn);
    color: #fff;
    font-size: 12px;
    line-height: 20px;
  }

  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  section { margin-bottom: 32px; scroll-margin-top: 56px; }
  h2 {
    font-size: 18px;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 5px solid var(--accent);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .meta { font-size: 13px; color: var(--sub); }
  .card h3 { font-size: 17px; line-height: 1.5; margin: 2px 0 6px; }
  .body { font-size: 15px; overflow-wrap: anywhere; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: bold;
    padding: 1px 8px;
    border-radius: 6px;
    margin-right: 6px;
    vertical-align: 2px;
  }
  .badge.new { background: var(--new); color: #fff; }
  .badge.important { background: var(--danger); color: #fff; }
  .empty { color: var(--sub); font-size: 14px; padding: 8px 0; }

  /* 提出物 */
  .due {
    display: flex; gap: 14px; align-items: center;
  }
  .due .remain {
    flex: 0 0 76px;
    text-align: center;
    border-radius: 10px;
    padding: 8px 4px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: bold;
    line-height: 1.2;
  }
  .due .remain .num { font-size: 24px; display: block; }
  .due .remain .unit { font-size: 12px; }
  .due.soon .remain { background: var(--warn-soft); color: var(--warn); }
  .due.today .remain { background: var(--danger-soft); color: var(--danger); }
  .due .info { flex: 1; min-width: 0; }
  .due .info h3 { margin: 0; }
  .due .deadline { font-size: 14px; font-weight: bold; }
  .due .info a { color: var(--accent); font-size: 14px; }
  details.past { margin-top: 8px; }
  details.past summary { cursor: pointer; color: var(--sub); font-size: 14px; padding: 4px 0; }
  details.past .card { opacity: .6; }

  /* 配布物 */
  .thumbs {
    display: flex; gap: 8px;
    overflow-x: auto;
    margin-top: 10px;
    padding-bottom: 4px;
  }
  .thumbs button {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0;
    background: #fff;
    cursor: zoom-in;
    overflow: hidden;
  }
  .thumbs img { display: block; height: 160px; width: auto; min-width: 113px; }
  .thumbs img:not([src]) { background: var(--line); animation: pulse 1.2s ease-in-out infinite; }
  .thumbs img.error { width: 113px; font-size: 11px; color: var(--danger); background: var(--danger-soft); }
  @keyframes pulse { 50% { opacity: .5; } }
  #viewer .loading { color: #ccc; padding: 40px; font-size: 15px; }
  .hint { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .duetag {
    display: inline-block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: bold;
    color: var(--warn);
    background: var(--warn-soft);
    padding: 2px 10px;
    border-radius: 6px;
  }

  /* 画像拡大 */
  #viewer {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.92);
    display: none;
    flex-direction: column;
  }
  #viewer.open { display: flex; }
  #viewer .bar {
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; padding: 10px 16px; font-size: 14px;
  }
  #viewer .bar button {
    background: none; border: 1px solid #888; color: #fff;
    border-radius: 8px; padding: 6px 14px; font-size: 15px; cursor: pointer;
  }
  #viewer .stage {
    flex: 1; overflow: auto;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 0 8px 16px;
  }
  #viewer img { max-width: 100%; height: auto; background: #fff; }
  #viewer .pager { display: flex; justify-content: center; gap: 16px; padding-bottom: 16px; }
  #viewer .pager button {
    background: #333; color: #fff; border: none; border-radius: 8px;
    padding: 8px 20px; font-size: 15px; cursor: pointer;
  }
  #viewer .pager button:disabled { opacity: .3; }

  footer { text-align: center; font-size: 12px; color: var(--sub); padding: 16px 16px 32px; }
</style>
</head>
<body>

<header>
  <div class="school" id="school"></div>
  <h1 id="pageTitle"></h1>
  <div class="updated" id="updated"></div>
</header>

<nav>
  <a href="#submissions">提出物<span class="count" id="dueCount" hidden></span></a>
  <a href="#handouts">配布物</a>
  <a href="#notices">お知らせ</a>
</nav>

<main>
  <section id="submissions">
    <h2>提出物</h2>
    <div id="dueList"></div>
  </section>

  <section id="handouts">
    <h2>配布物（お手紙）</h2>
    <div id="handoutList"></div>
  </section>

  <section id="notices">
    <h2>お知らせ</h2>
    <div id="noticeList"></div>
  </section>
</main>

<footer id="footer"></footer>

<div id="viewer" role="dialog" aria-modal="true" aria-label="画像の拡大表示">
  <div class="bar">
    <span id="viewerTitle"></span>
    <button type="button" id="viewerClose">閉じる ✕</button>
  </div>
  <div class="stage"><div class="loading" id="viewerLoading">読み込み中…</div><img id="viewerImg" alt=""></div>
  <div class="pager" id="viewerPager">
    <button type="button" id="viewerPrev">◀ 前</button>
    <button type="button" id="viewerNext">次 ▶</button>
  </div>
</div>

<script>
  const DATA = <?!= dataJson ?>;
</script>
<script>
(function () {
  const NEW_DAYS = 7;       // 掲載から何日間「NEW」を付けるか
  const SOON_DAYS = 3;      // 期限が何日以内なら色を変えるか
  const WEEK = ["日", "月", "火", "水", "木", "金", "土"];

  const handouts = DATA.handouts || [];
  const submissions = DATA.submissions || [];
  const notices = DATA.notices || [];
  const info = DATA.info || {};

  // ---- ユーティリティ ----
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function text(s) { return esc(s).replace(/\n/g, "<br>"); }
  function parseDate(s) {
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || "").trim());
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function fmt(s) {
    const d = parseDate(s);
    return d ? `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）` : esc(s);
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  function daysFromToday(s) {
    const d = parseDate(s);
    return d ? Math.round((d - today) / 86400000) : null;
  }
  function isNew(s) {
    const n = daysFromToday(s);
    return n !== null && n <= 0 && n > -NEW_DAYS;
  }
  function byDateDesc(a, b) { return (parseDate(b.date) || 0) - (parseDate(a.date) || 0); }

  // ---- ヘッダー ----
  document.getElementById("school").textContent = info.school || "";
  const title = [info.className, info.title].filter(Boolean).join(" ");
  document.getElementById("pageTitle").textContent = title || "学級だより";
  if (title) document.title = title;
  if (info.updated) document.getElementById("updated").textContent = "最終更新：" + fmt(info.updated);
  document.getElementById("footer").textContent = info.contact || "";

  // ---- ① 配布物 ----
  const sortedHandouts = handouts.slice().sort(byDateDesc);
  const handoutEl = document.getElementById("handoutList");
  if (!sortedHandouts.length) {
    handoutEl.innerHTML = '<p class="empty">現在、配布物はありません。</p>';
  } else {
    handoutEl.innerHTML = sortedHandouts.map((h, i) => {
      const imgs = h.images || [];
      return `
      <article class="card" id="handout-${i}">
        <div class="meta">${isNew(h.date) ? '<span class="badge new">NEW</span>' : ""}${fmt(h.date)} 配布</div>
        <h3>${esc(h.title)}</h3>
        ${h.description ? `<div class="body">${text(h.description)}</div>` : ""}
        ${h.deadline ? `<div class="duetag">提出：${esc(h.submitWhat || "あり")}（${fmt(h.deadline)}まで）</div>` : ""}
        ${imgs.length ? `
          <div class="thumbs">
            ${imgs.map((src, j) => `
              <button type="button" data-h="${i}" data-p="${j}" aria-label="${esc(h.title)} ${j + 1}枚目を拡大">
                <img data-id="${esc(src)}" alt="${esc(h.title)} ${j + 1}枚目">
              </button>`).join("")}
          </div>
          <div class="hint">画像をタップすると大きく表示されます${imgs.length > 1 ? `（全${imgs.length}枚）` : ""}</div>` : ""}
      </article>`;
    }).join("");
  }

  // ---- ② 提出物（配布物の deadline も合わせて表示） ----
  const dueItems = submissions.map(s => ({
    title: s.title, deadline: s.deadline, note: s.note
  })).concat(sortedHandouts.map((h, i) => h.deadline ? {
    title: h.submitWhat ? `${h.submitWhat}（${h.title}）` : h.title,
    deadline: h.deadline,
    link: i,
  } : null).filter(Boolean));

  const upcoming = [], past = [];
  dueItems.forEach(d => {
    d.days = daysFromToday(d.deadline);
    (d.days !== null && d.days < 0 ? past : upcoming).push(d);
  });
  upcoming.sort((a, b) => (a.days ?? 9999) - (b.days ?? 9999));
  past.sort((a, b) => b.days - a.days);

  function dueCard(d) {
    let cls = "", remain;
    if (d.days === null) {
      remain = `<span class="unit">期限</span><span class="num">―</span>`;
    } else if (d.days < 0) {
      remain = `<span class="unit">期限</span><span class="num" style="font-size:16px">終了</span>`;
    } else if (d.days === 0) {
      cls = "today";
      remain = `<span class="num" style="font-size:20px">今日</span><span class="unit">まで</span>`;
    } else {
      if (d.days <= SOON_DAYS) cls = "soon";
      remain = `<span class="unit">あと</span><span class="num">${d.days}</span><span class="unit">日</span>`;
    }
    return `
    <article class="card due ${cls}">
      <div class="remain">${remain}</div>
      <div class="info">
        <div class="deadline">${fmt(d.deadline)}まで</div>
        <h3>${esc(d.title)}</h3>
        ${d.note ? `<div class="body">${text(d.note)}</div>` : ""}
        ${d.link !== undefined ? `<a href="#handout-${d.link}">お手紙を見る ›</a>` : ""}
      </div>
    </article>`;
  }

  const dueEl = document.getElementById("dueList");
  let html = upcoming.length
    ? upcoming.map(dueCard).join("")
    : '<p class="empty">現在、提出期限のあるものはありません。</p>';
  if (past.length) {
    html += `<details class="past"><summary>期限が過ぎたもの（${past.length}件）</summary>${past.map(dueCard).join("")}</details>`;
  }
  dueEl.innerHTML = html;

  const countEl = document.getElementById("dueCount");
  if (upcoming.length) { countEl.textContent = upcoming.length; countEl.hidden = false; }

  // ---- ③ お知らせ ----
  const sortedNotices = notices.slice().sort((a, b) =>
    (b.important ? 1 : 0) - (a.important ? 1 : 0) || byDateDesc(a, b));
  const noticeEl = document.getElementById("noticeList");
  noticeEl.innerHTML = sortedNotices.length ? sortedNotices.map(n => `
    <article class="card">
      <div class="meta">
        ${n.important ? '<span class="badge important">重要</span>' : ""}${isNew(n.date) ? '<span class="badge new">NEW</span>' : ""}${fmt(n.date)}
      </div>
      <h3>${esc(n.title)}</h3>
      ${n.body ? `<div class="body">${text(n.body)}</div>` : ""}
    </article>`).join("")
    : '<p class="empty">現在、お知らせはありません。</p>';

  // ---- 画像の読み込み（Drive から GAS 経由で取得） ----
  const imageCache = {};
  function loadImage(id, width) {
    const key = id + "@" + width;
    if (!imageCache[key]) {
      imageCache[key] = new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getImage(id, width);
      });
      imageCache[key].catch(() => { delete imageCache[key]; });
    }
    return imageCache[key];
  }
  // 一度に大量に呼ぶと遅くなるので、画面に近づいたものから順に読む
  const thumbObserver = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      thumbObserver.unobserve(e.target);
      loadThumb(e.target);
    });
  }, { rootMargin: "300px" }) : null;
  function loadThumb(img) {
    loadImage(img.dataset.id, 400)
      .then(url => { img.src = url; })
      .catch(() => { img.classList.add("error"); img.alt = "画像を読み込めませんでした"; });
  }
  handoutEl.querySelectorAll("img[data-id]").forEach(img =>
    thumbObserver ? thumbObserver.observe(img) : loadThumb(img));

  // ---- 画像の拡大表示 ----
  const viewer = document.getElementById("viewer");
  const vImg = document.getElementById("viewerImg");
  const vTitle = document.getElementById("viewerTitle");
  const vPrev = document.getElementById("viewerPrev");
  const vNext = document.getElementById("viewerNext");
  const vPager = document.getElementById("viewerPager");
  let cur = null, page = 0;

  const vLoading = document.getElementById("viewerLoading");
  function show() {
    const imgs = cur.images;
    const want = page;
    vImg.removeAttribute("src");
    vImg.style.display = "none";
    vLoading.textContent = "読み込み中…";
    vLoading.style.display = "";
    loadImage(imgs[page], 1600).then(url => {
      if (want !== page || !viewer.classList.contains("open")) return;
      vImg.src = url;
      vImg.style.display = "";
      vLoading.style.display = "none";
    }).catch(() => {
      if (want === page) vLoading.textContent = "画像を読み込めませんでした。時間をおいて再度お試しください。";
    });
    vImg.alt = `${cur.title} ${page + 1}枚目`;
    vTitle.textContent = imgs.length > 1 ? `${cur.title}（${page + 1} / ${imgs.length}）` : cur.title;
    vPager.style.display = imgs.length > 1 ? "flex" : "none";
    vPrev.disabled = page === 0;
    vNext.disabled = page === imgs.length - 1;
  }
  function close() {
    viewer.classList.remove("open");
    document.body.style.overflow = "";
  }
  handoutEl.addEventListener("click", e => {
    const btn = e.target.closest("button[data-h]");
    if (!btn) return;
    cur = sortedHandouts[+btn.dataset.h];
    page = +btn.dataset.p;
    show();
    viewer.classList.add("open");
    document.body.style.overflow = "hidden";
  });
  document.getElementById("viewerClose").addEventListener("click", close);
  vPrev.addEventListener("click", () => { if (page > 0) { page--; show(); } });
  vNext.addEventListener("click", () => { if (page < cur.images.length - 1) { page++; show(); } });
  document.addEventListener("keydown", e => {
    if (!viewer.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") vPrev.click();
    if (e.key === "ArrowRight") vNext.click();
  });
})();
</script>
</body>
</html>
