<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>つかめ！将来の星 — 発表評価フォーム</title>
  <style>
    /* ─── リセット ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── ページ全体 ─── */
    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Yu Gothic', sans-serif;
      background: linear-gradient(145deg, #7C4DFF 0%, #448AFF 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px 40px;
    }

    /* ─── カード ─── */
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
    }

    /* ─── ヘッダー ─── */
    .header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 2px dashed #D1C4E9;
    }
    .header .hero-emoji {
      font-size: 56px;
      line-height: 1;
      display: block;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 18px;
      color: #4A148C;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .header .subtitle {
      font-size: 13px;
      color: #9E9E9E;
    }

    /* ─── フォームグループ ─── */
    .form-group { margin-bottom: 20px; }

    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }
    .form-label .icon { font-size: 17px; }
    .required {
      font-size: 11px;
      font-weight: normal;
      color: #E53935;
      background: #FFEBEE;
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* ─── テキスト入力 ─── */
    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #E0E0E0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      background: #FAFAFA;
    }
    input[type="text"]:focus,
    textarea:focus {
      border-color: #7C4DFF;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.13);
    }
    input[type="text"]::placeholder,
    textarea::placeholder { color: #BDBDBD; }
    textarea {
      height: 96px;
      resize: vertical;
      line-height: 1.65;
    }

    /* ─── スター評価 ─── */
    .star-box {
      background: #F9F6FF;
      border: 2px solid #E0E0E0;
      border-radius: 12px;
      padding: 14px 16px 10px;
    }
    .star-rating {
      display: flex;
      flex-direction: row-reverse; /* CSS魔法: 後のinputがcheckedならそれ以降のlabelも光る */
      justify-content: flex-end;
      gap: 2px;
    }
    .star-rating input[type="radio"] { display: none; }
    .star-rating label {
      font-size: 42px;
      color: #E0E0E0;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s, transform 0.15s;
      user-select: none;
    }
    .star-rating label:hover { transform: scale(1.18); }
    /* checked な input 以降（＝視覚的に左側）の label を全て光らせる */
    .star-rating input[type="radio"]:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label {
      color: #FFC107;
    }
    .star-hint {
      margin-top: 8px;
      font-size: 11px;
      color: #9E9E9E;
      display: flex;
      justify-content: space-between;
    }

    /* ─── エラーメッセージ ─── */
    .error-msg {
      display: none;
      background: #FFEBEE;
      color: #B71C1C;
      border-left: 4px solid #EF5350;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* ─── 送信ボタン ─── */
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #7C4DFF 0%, #448AFF 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(124, 77, 255, 0.38);
      transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(124, 77, 255, 0.46);
    }
    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(124, 77, 255, 0.3);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ─── ローディング ─── */
    .loading-row {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      color: #7C4DFF;
      font-size: 14px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid #D1C4E9;
      border-top-color: #7C4DFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── 送信完了画面 ─── */
    #successSection {
      display: none;
      text-align: center;
      padding: 10px 0 4px;
    }
    .success-emoji {
      font-size: 66px;
      display: block;
      margin-bottom: 14px;
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes pop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .success-title {
      font-size: 22px;
      color: #4A148C;
      margin-bottom: 10px;
    }
    .success-desc {
      font-size: 14px;
      color: #616161;
      line-height: 1.8;
      margin-bottom: 26px;
    }
    .back-btn {
      display: inline-block;
      padding: 13px 30px;
      background: linear-gradient(135deg, #7C4DFF 0%, #448AFF 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(124, 77, 255, 0.36);
      transition: transform 0.18s;
    }
    .back-btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">

    <!-- ══════════ フォーム画面 ══════════ -->
    <div id="formSection">
      <div class="header">
        <span class="hero-emoji">🌟</span>
        <h1>つかめ！将来の星</h1>
        <p class="subtitle">発表評価フォーム</p>
      </div>

      <form id="evalForm" novalidate>

        <!-- あなたのお名前 -->
        <div class="form-group">
          <div class="form-label">
            <span class="icon">📝</span>
            あなたのお名前
            <span class="required">必須</span>
          </div>
          <input
            type="text"
            id="reviewerName"
            placeholder="例：山田 太郎"
            autocomplete="name"
            maxlength="50"
          >
        </div>

        <!-- 発表者のお名前 -->
        <div class="form-group">
          <div class="form-label">
            <span class="icon">🎤</span>
            発表者のお名前
            <span class="required">必須</span>
          </div>
          <input
            type="text"
            id="presenterName"
            placeholder="例：田中 花子"
            maxlength="50"
          >
        </div>

        <!-- 評価（星） -->
        <div class="form-group">
          <div class="form-label">
            <span class="icon">⭐</span>
            発表の評価
            <span class="required">必須</span>
          </div>
          <div class="star-box">
            <div class="star-rating">
              <input type="radio" id="star5" name="rating" value="5">
              <label for="star5" title="★★★★★ とてもよかった！">★</label>
              <input type="radio" id="star4" name="rating" value="4">
              <label for="star4" title="★★★★ よかった">★</label>
              <input type="radio" id="star3" name="rating" value="3">
              <label for="star3" title="★★★ ふつう">★</label>
              <input type="radio" id="star2" name="rating" value="2">
              <label for="star2" title="★★ もう少し">★</label>
              <input type="radio" id="star1" name="rating" value="1">
              <label for="star1" title="★ がんばろう">★</label>
            </div>
            <div class="star-hint">
              <span>★ がんばろう</span>
              <span>★★★★★ とてもよかった！</span>
            </div>
          </div>
        </div>

        <!-- 応援コメント -->
        <div class="form-group">
          <div class="form-label">
            <span class="icon">💬</span>
            応援コメント
          </div>
          <textarea
            id="comment"
            placeholder="発表者への応援メッセージを書いてね！（なくてもOK）"
            maxlength="200"
          ></textarea>
        </div>

        <!-- エラー表示 -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- 送信ボタン -->
        <button type="submit" class="submit-btn" id="submitBtn">
          📨 送信する
        </button>

        <!-- ローディング -->
        <div class="loading-row" id="loadingRow">
          <div class="spinner"></div>
          <span>送信中です…</span>
        </div>

      </form>
    </div><!-- /formSection -->

    <!-- ══════════ 完了画面 ══════════ -->
    <div id="successSection">
      <span class="success-emoji">🎉</span>
      <h2 class="success-title">ありがとうございました！</h2>
      <p class="success-desc">
        評価を送信しました。<br>
        発表者にしっかり届けます！
      </p>
      <button class="back-btn" onclick="resetForm()">
        ほかの発表者を評価する
      </button>
    </div>

  </div><!-- /card -->

  <script>
    const form        = document.getElementById('evalForm');
    const submitBtn   = document.getElementById('submitBtn');
    const loadingRow  = document.getElementById('loadingRow');
    const errorMsg    = document.getElementById('errorMsg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const reviewerName  = document.getElementById('reviewerName').value.trim();
      const presenterName = document.getElementById('presenterName').value.trim();
      const ratingInput   = document.querySelector('input[name="rating"]:checked');
      const comment       = document.getElementById('comment').value.trim();

      // ── バリデーション ──
      if (!reviewerName) {
        showError('あなたのお名前を入力してください。');
        document.getElementById('reviewerName').focus();
        return;
      }
      if (!presenterName) {
        showError('発表者のお名前を入力してください。');
        document.getElementById('presenterName').focus();
        return;
      }
      if (!ratingInput) {
        showError('評価（★）を選んでください。');
        return;
      }

      hideError();
      setLoading(true);

      const formData = {
        reviewerName:  reviewerName,
        presenterName: presenterName,
        rating:        parseInt(ratingInput.value, 10),
        comment:       comment
      };

      // GAS のサーバー関数を呼び出す
      google.script.run
        .withSuccessHandler(function (result) {
          setLoading(false);
          if (result && result.success) {
            showSuccess();
          } else {
            showError('送信に失敗しました。もう一度お試しください。');
          }
        })
        .withFailureHandler(function (err) {
          setLoading(false);
          showError('エラーが発生しました。もう一度お試しください。');
          console.error(err);
        })
        .submitEvaluation(formData);
    });

    function setLoading(on) {
      submitBtn.disabled      = on;
      loadingRow.style.display = on ? 'flex' : 'none';
    }

    function showError(msg) {
      errorMsg.textContent   = msg;
      errorMsg.style.display = 'block';
      errorMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    function showSuccess() {
      document.getElementById('formSection').style.display  = 'none';
      document.getElementById('successSection').style.display = 'block';
    }

    function resetForm() {
      form.reset();
      hideError();
      document.getElementById('formSection').style.display  = 'block';
      document.getElementById('successSection').style.display = 'none';
      submitBtn.disabled = false;
    }
  </script>
</body>
</html>
