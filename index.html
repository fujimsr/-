<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棒人間くじ引き</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    background-size: 400% 400%;
    animation: bgShift 15s ease infinite;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #fff;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(255, 200, 50, 0.8);
    letter-spacing: 4px;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #aaa;
    margin-bottom: 20px;
  }

  /* --- Stage --- */
  .stage-container {
    position: relative;
    width: 700px;
    max-width: 95vw;
  }

  canvas#stageCanvas {
    width: 100%;
    height: 360px;
    border-radius: 16px;
    background: radial-gradient(ellipse at center bottom, #1a1a40 0%, #0d0d2b 100%);
    box-shadow: 0 0 40px rgba(100, 80, 255, 0.3);
  }

  /* --- Controls --- */
  .controls {
    margin-top: 18px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  .item-input {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .item-input input {
    padding: 10px 14px;
    border: 2px solid #555;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1rem;
    width: 180px;
    outline: none;
    transition: border-color 0.3s;
  }
  .item-input input:focus { border-color: #f0c040; }

  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.95); }

  .btn-add {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #1a1a40;
  }
  .btn-add:hover { box-shadow: 0 0 16px rgba(67, 233, 123, 0.6); }

  .btn-draw {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #1a1a40;
    font-size: 1.15rem;
    padding: 12px 36px;
  }
  .btn-draw:hover { box-shadow: 0 0 24px rgba(255, 210, 0, 0.7); }
  .btn-draw:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-reset {
    background: linear-gradient(135deg, #eb3349, #f45c43);
    color: #fff;
  }
  .btn-reset:hover { box-shadow: 0 0 16px rgba(235, 51, 73, 0.6); }

  /* --- Items list --- */
  .items-bar {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 700px;
  }

  .item-chip {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s;
  }
  .item-chip.drawn {
    opacity: 0.35;
    text-decoration: line-through;
  }
  .item-chip .remove {
    cursor: pointer;
    color: #f66;
    font-weight: bold;
    font-size: 1.1rem;
    line-height: 1;
  }

  /* --- Result overlay --- */
  .result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
  }
  .result-overlay.show { display: flex; }

  .result-card {
    background: linear-gradient(145deg, #2d2b55, #1e1b4b);
    border: 3px solid #ffd200;
    border-radius: 24px;
    padding: 40px 60px;
    text-align: center;
    box-shadow: 0 0 60px rgba(255, 210, 0, 0.4);
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
  }

  @keyframes popIn {
    0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .result-card h2 {
    font-size: 1.2rem;
    color: #ffd200;
    margin-bottom: 10px;
  }
  .result-card .result-text {
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(90deg, #ffd200, #ff6a00, #ffd200);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  .result-card .close-btn {
    margin-top: 24px;
    padding: 10px 30px;
    border: 2px solid #ffd200;
    background: transparent;
    color: #ffd200;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .result-card .close-btn:hover {
    background: #ffd200;
    color: #1e1b4b;
  }

  /* --- Firework canvas --- */
  canvas#fwCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 200;
  }

  /* --- Presets --- */
  .presets {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .preset-btn {
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: #ccc;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset-btn:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
</style>
</head>
<body>

<h1>棒人間くじ引き</h1>
<p class="subtitle">アイテムを追加して、運命の一引きを!</p>

<div class="stage-container">
  <canvas id="stageCanvas"></canvas>
</div>

<div class="controls">
  <div class="item-input">
    <input type="text" id="itemInput" placeholder="くじの項目を入力..." maxlength="20">
    <button class="btn btn-add" onclick="addItem()">追加</button>
  </div>
  <button class="btn btn-draw" id="drawBtn" onclick="startDraw()" disabled>くじを引く!</button>
  <button class="btn btn-reset" onclick="resetAll()">リセット</button>
</div>

<div class="presets">
  <button class="preset-btn" onclick="loadPreset('omikuji')">おみくじ</button>
  <button class="preset-btn" onclick="loadPreset('janken')">じゃんけん</button>
  <button class="preset-btn" onclick="loadPreset('lunch')">ランチ</button>
  <button class="preset-btn" onclick="loadPreset('penalty')">罰ゲーム</button>
</div>

<div class="items-bar" id="itemsBar"></div>

<!-- Result overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <h2>結果発表!</h2>
    <div class="result-text" id="resultText"></div>
    <canvas id="miniStickCanvas" width="200" height="160"></canvas>
    <br>
    <button class="close-btn" onclick="closeResult()">OK!</button>
  </div>
</div>

<!-- Fireworks canvas -->
<canvas id="fwCanvas"></canvas>

<script>
// ============================================================
//  DATA
// ============================================================
let items = [];
let drawnItems = [];
let isDrawing = false;

const presets = {
  omikuji: ['大吉', '中吉', '小吉', '吉', '末吉', '凶', '大凶'],
  janken: ['グー', 'チョキ', 'パー'],
  lunch: ['ラーメン', 'カレー', '寿司', 'パスタ', '焼肉', 'うどん', 'ハンバーガー'],
  penalty: ['モノマネ', '一発ギャグ', '腕立て10回', '変顔', 'おごり', '告白']
};

// ============================================================
//  AUDIO (Web Audio API – simple synth)
// ============================================================
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTick() {
  const ctx = getAudio();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(800 + Math.random() * 600, ctx.currentTime);
  g.gain.setValueAtTime(0.08, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.08);
}

function playFanfare() {
  const ctx = getAudio();
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f, ctx.currentTime + i * 0.15);
    g.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + i * 0.15);
    o.stop(ctx.currentTime + i * 0.15 + 0.5);
  });
}

function playDrumRoll() {
  const ctx = getAudio();
  for (let i = 0; i < 30; i++) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(100 + Math.random() * 50, ctx.currentTime + i * 0.05);
    g.gain.setValueAtTime(0.04, ctx.currentTime + i * 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.05);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + i * 0.05);
    o.stop(ctx.currentTime + i * 0.05 + 0.06);
  }
}

// ============================================================
//  STICK FIGURE DRAWING HELPERS
// ============================================================
function drawStickFigure(ctx, x, y, scale, pose, color = '#fff') {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Head
  ctx.beginPath();
  ctx.arc(0, -50, 12, 0, Math.PI * 2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(0, -38);
  ctx.lineTo(0, 0);
  ctx.stroke();

  switch (pose) {
    case 'idle':
      // Arms down
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-20, -10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(20, -10); ctx.stroke();
      // Legs
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-15, 30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(15, 30); ctx.stroke();
      // Face – neutral
      drawFace(ctx, 'neutral');
      break;

    case 'excited':
      // Arms up
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-25, -55); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(25, -55); ctx.stroke();
      // Legs apart
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, 28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(18, 28); ctx.stroke();
      // Face – happy
      drawFace(ctx, 'happy');
      break;

    case 'nervous': {
      const t = Date.now() / 200;
      const shake = Math.sin(t) * 3;
      // Arms shaking
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-18 + shake, -15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(18 + shake, -15); ctx.stroke();
      // Legs
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12 + shake, 28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(12 - shake, 28); ctx.stroke();
      // Face – nervous
      drawFace(ctx, 'nervous');
      break;
    }

    case 'jump': {
      const jt = Date.now() / 300;
      const jumpY = Math.abs(Math.sin(jt)) * 15;
      ctx.translate(0, -jumpY);
      // Arms way up
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-28, -60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(28, -60); ctx.stroke();
      // Legs bent
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-10, 15); ctx.lineTo(-18, 28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, 15); ctx.lineTo(18, 28); ctx.stroke();
      // Face – ecstatic
      drawFace(ctx, 'ecstatic');
      break;
    }

    case 'cry': {
      // Arms droopy
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-20, -5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(20, -5); ctx.stroke();
      // Legs together
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, 30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(8, 30); ctx.stroke();
      // Head tilt
      drawFace(ctx, 'sad');
      // Tears
      const tt = Date.now() / 400;
      ctx.fillStyle = '#5bc0fa';
      ctx.beginPath(); ctx.arc(-6, -42 + (tt % 1) * 10, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -44 + ((tt + 0.5) % 1) * 10, 2, 0, Math.PI * 2); ctx.fill();
      break;
    }

    case 'dance': {
      const dt = Date.now() / 250;
      const s = Math.sin(dt);
      const c = Math.cos(dt);
      // Arms waving
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-25 * c, -45 + 10 * s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(25 * c, -45 - 10 * s); ctx.stroke();
      // Legs dancing
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-15 - 5 * s, 28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(15 + 5 * s, 28); ctx.stroke();
      drawFace(ctx, 'happy');
      break;
    }
  }

  ctx.restore();
}

function drawFace(ctx, expression) {
  ctx.fillStyle = ctx.strokeStyle;
  switch (expression) {
    case 'neutral':
      ctx.fillRect(-5, -53, 3, 3);
      ctx.fillRect(3, -53, 3, 3);
      ctx.beginPath(); ctx.moveTo(-4, -44); ctx.lineTo(4, -44); ctx.stroke();
      break;
    case 'happy':
      ctx.fillRect(-5, -53, 3, 3);
      ctx.fillRect(3, -53, 3, 3);
      ctx.beginPath(); ctx.arc(0, -48, 5, 0.1, Math.PI - 0.1); ctx.stroke();
      break;
    case 'ecstatic':
      // Star eyes
      drawStar(ctx, -4, -52, 3, 5);
      drawStar(ctx, 4, -52, 3, 5);
      ctx.beginPath(); ctx.arc(0, -47, 6, 0, Math.PI); ctx.fill();
      break;
    case 'nervous':
      ctx.fillRect(-5, -54, 3, 4);
      ctx.fillRect(3, -54, 3, 4);
      ctx.beginPath();
      ctx.moveTo(-5, -43);
      ctx.lineTo(-2, -45);
      ctx.lineTo(2, -43);
      ctx.lineTo(5, -45);
      ctx.stroke();
      break;
    case 'sad':
      ctx.fillRect(-5, -53, 3, 3);
      ctx.fillRect(3, -53, 3, 3);
      ctx.beginPath(); ctx.arc(0, -41, 5, Math.PI + 0.1, -0.1); ctx.stroke();
      break;
  }
}

function drawStar(ctx, cx, cy, r, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const radius = i % 2 === 0 ? r : r * 0.4;
    const angle = (i * Math.PI) / points - Math.PI / 2;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

// ============================================================
//  LOTTERY BOX DRAWING
// ============================================================
function drawLotteryBox(ctx, x, y, shaking) {
  ctx.save();
  ctx.translate(x, y);
  if (shaking) {
    ctx.translate(Math.random() * 6 - 3, Math.random() * 4 - 2);
    ctx.rotate((Math.random() - 0.5) * 0.05);
  }

  // Box body
  const grad = ctx.createLinearGradient(-40, -50, 40, 50);
  grad.addColorStop(0, '#c0392b');
  grad.addColorStop(1, '#e74c3c');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(-40, -20, 80, 70, 6);
  ctx.fill();

  // Box top / opening
  ctx.fillStyle = '#922b21';
  ctx.fillRect(-45, -25, 90, 12);

  // Hole on top
  ctx.fillStyle = '#1a1a40';
  ctx.beginPath();
  ctx.ellipse(0, -19, 15, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Label
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('福', 0, 25);

  // Decorative lines
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-35, -15, 70, 58);

  ctx.restore();
}

// ============================================================
//  SLOT-STYLE TEXT ROLLER
// ============================================================
let rollerItems = [];
let rollerIndex = 0;
let rollerSpeed = 0;
let rollerResult = '';

function drawRoller(ctx, x, y, w, h) {
  if (rollerItems.length === 0) return;

  ctx.save();
  ctx.translate(x, y);

  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(-w / 2, -h / 2, w, h, 10);
  ctx.fill();

  // Border glow
  ctx.strokeStyle = isDrawing ? '#ffd200' : 'rgba(255,210,0,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-w / 2, -h / 2, w, h, 10);
  ctx.stroke();

  // Text
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const idx = Math.floor(rollerIndex) % rollerItems.length;
  const currentText = rollerItems[idx];
  ctx.fillText(currentText, 0, 0);

  // Side texts (faded)
  ctx.globalAlpha = 0.3;
  ctx.font = 'bold 18px sans-serif';
  const prevIdx = (idx - 1 + rollerItems.length) % rollerItems.length;
  const nextIdx = (idx + 1) % rollerItems.length;
  ctx.fillText(rollerItems[prevIdx], 0, -30);
  ctx.fillText(rollerItems[nextIdx], 0, 30);

  ctx.restore();
}

// ============================================================
//  SPARKLE / PARTICLE SYSTEM
// ============================================================
let sparkles = [];

function addSparkles(x, y, count, canvas) {
  for (let i = 0; i < count; i++) {
    sparkles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 1,
      decay: 0.01 + Math.random() * 0.02,
      color: `hsl(${Math.random() * 60 + 30}, 100%, 60%)`,
      size: 2 + Math.random() * 4,
      canvas
    });
  }
}

function updateSparkles(ctx) {
  sparkles = sparkles.filter(s => s.life > 0);
  sparkles.forEach(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.1;
    s.life -= s.decay;
    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ============================================================
//  FIREWORKS
// ============================================================
let fireworks = [];
let fwParticles = [];

function launchFireworks(count) {
  const fwCanvas = document.getElementById('fwCanvas');
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      fireworks.push({
        x: Math.random() * fwCanvas.width,
        y: fwCanvas.height,
        targetY: Math.random() * fwCanvas.height * 0.4 + 50,
        speed: 6 + Math.random() * 4,
        hue: Math.random() * 360
      });
    }, i * 300);
  }
}

function updateFireworks(ctx, canvas) {
  fireworks = fireworks.filter(fw => {
    fw.y -= fw.speed;
    // Trail
    ctx.fillStyle = `hsla(${fw.hue}, 100%, 70%, 0.8)`;
    ctx.beginPath();
    ctx.arc(fw.x, fw.y, 3, 0, Math.PI * 2);
    ctx.fill();

    if (fw.y <= fw.targetY) {
      // Explode
      for (let i = 0; i < 60; i++) {
        const angle = (Math.PI * 2 * i) / 60;
        const speed = 2 + Math.random() * 4;
        fwParticles.push({
          x: fw.x, y: fw.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.01 + Math.random() * 0.015,
          hue: fw.hue + Math.random() * 40 - 20,
          size: 2 + Math.random() * 2
        });
      }
      return false;
    }
    return true;
  });

  fwParticles = fwParticles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, 1)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    return p.life > 0;
  });
  ctx.globalAlpha = 1;
}

// ============================================================
//  MAIN CANVAS ANIMATION
// ============================================================
const stageCanvas = document.getElementById('stageCanvas');
const sCtx = stageCanvas.getContext('2d');
const fwCanvas = document.getElementById('fwCanvas');
const fwCtx = fwCanvas.getContext('2d');

let stickPose = 'idle';
let stickColor = '#fff';
let bgStars = [];

function resizeCanvases() {
  const rect = stageCanvas.getBoundingClientRect();
  stageCanvas.width = rect.width * devicePixelRatio;
  stageCanvas.height = rect.height * devicePixelRatio;
  sCtx.scale(devicePixelRatio, devicePixelRatio);

  fwCanvas.width = window.innerWidth * devicePixelRatio;
  fwCanvas.height = window.innerHeight * devicePixelRatio;
  fwCtx.scale(devicePixelRatio, devicePixelRatio);

  // Generate background stars
  bgStars = [];
  for (let i = 0; i < 50; i++) {
    bgStars.push({
      x: Math.random() * rect.width,
      y: Math.random() * rect.height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.005 + 0.002
    });
  }
}
resizeCanvases();
window.addEventListener('resize', resizeCanvases);

function stageWidth() { return stageCanvas.width / devicePixelRatio; }
function stageHeight() { return stageCanvas.height / devicePixelRatio; }

// Crowd of small stick figures
function drawCrowd(ctx) {
  const count = Math.min(items.length, 8);
  const spacing = stageWidth() / (count + 1);
  const colors = ['#5bc0fa', '#43e97b', '#f7971e', '#eb3349', '#a78bfa', '#f472b6', '#facc15', '#34d399'];

  for (let i = 0; i < count; i++) {
    const cx = spacing * (i + 1);
    const cy = stageHeight() - 50;
    const pose = isDrawing ? 'nervous' : (drawnItems.length > 0 ? 'dance' : 'idle');
    drawStickFigure(ctx, cx, cy, 0.55, pose, colors[i % colors.length]);

    // Name tag
    ctx.fillStyle = colors[i % colors.length];
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(items[i], cx, stageHeight() - 10);
  }
}

let frameCount = 0;

function renderStage() {
  const w = stageWidth();
  const h = stageHeight();
  sCtx.clearRect(0, 0, w, h);

  // Stars
  bgStars.forEach(star => {
    const twinkle = Math.sin(frameCount * star.speed) * 0.5 + 0.5;
    sCtx.globalAlpha = twinkle;
    sCtx.fillStyle = '#fff';
    sCtx.beginPath();
    sCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    sCtx.fill();
  });
  sCtx.globalAlpha = 1;

  // Floor line
  sCtx.strokeStyle = 'rgba(255,255,255,0.1)';
  sCtx.lineWidth = 1;
  sCtx.beginPath();
  sCtx.moveTo(20, h - 25);
  sCtx.lineTo(w - 20, h - 25);
  sCtx.stroke();

  // Spotlight
  if (isDrawing) {
    const spotGrad = sCtx.createRadialGradient(w / 2, h / 2 - 40, 10, w / 2, h / 2 - 40, 120);
    spotGrad.addColorStop(0, 'rgba(255, 210, 0, 0.1)');
    spotGrad.addColorStop(1, 'rgba(255, 210, 0, 0)');
    sCtx.fillStyle = spotGrad;
    sCtx.fillRect(0, 0, w, h);
  }

  // Main stick figure
  const mainX = w / 2;
  const mainY = h / 2 + 20;
  drawStickFigure(sCtx, mainX - 90, mainY, 1.0, stickPose, stickColor);

  // Lottery box
  drawLotteryBox(sCtx, mainX + 60, mainY + 10, isDrawing);

  // Roller
  drawRoller(sCtx, mainX + 60, mainY - 60, 160, 70);

  // Crowd
  if (items.length > 0) {
    drawCrowd(sCtx);
  }

  // Sparkles
  updateSparkles(sCtx);

  // Instruction text if no items
  if (items.length === 0 && drawnItems.length === 0) {
    sCtx.fillStyle = 'rgba(255,255,255,0.3)';
    sCtx.font = '16px sans-serif';
    sCtx.textAlign = 'center';
    sCtx.fillText('下のプリセットまたは入力欄からアイテムを追加しよう!', w / 2, h - 8);
  }

  frameCount++;
  requestAnimationFrame(renderStage);
}

function renderFireworks() {
  fwCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  updateFireworks(fwCtx, fwCanvas);
  requestAnimationFrame(renderFireworks);
}

renderStage();
renderFireworks();

// ============================================================
//  ITEM MANAGEMENT
// ============================================================
function addItem(text) {
  const input = document.getElementById('itemInput');
  const val = text || input.value.trim();
  if (!val) return;
  if (items.length >= 20) return;
  items.push(val);
  if (!text) input.value = '';
  updateUI();
}

document.getElementById('itemInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addItem();
});

function removeItem(idx) {
  items.splice(idx, 1);
  updateUI();
}

function resetAll() {
  items = [];
  drawnItems = [];
  rollerItems = [];
  stickPose = 'idle';
  stickColor = '#fff';
  updateUI();
}

function loadPreset(name) {
  items = [...presets[name]];
  drawnItems = [];
  stickPose = 'idle';
  stickColor = '#fff';
  updateUI();
}

function updateUI() {
  const bar = document.getElementById('itemsBar');
  const available = items.filter(it => !drawnItems.includes(it));
  bar.innerHTML = items.map((it, i) => {
    const drawn = drawnItems.includes(it);
    return `<span class="item-chip ${drawn ? 'drawn' : ''}">
      ${it}
      ${!drawn ? `<span class="remove" onclick="removeItem(${i})">&times;</span>` : ''}
    </span>`;
  }).join('');

  const drawBtn = document.getElementById('drawBtn');
  drawBtn.disabled = available.length === 0 || isDrawing;

  // Update roller items
  rollerItems = available.length > 0 ? available : items;
}

// ============================================================
//  LOTTERY DRAW
// ============================================================
async function startDraw() {
  if (isDrawing) return;
  const available = items.filter(it => !drawnItems.includes(it));
  if (available.length === 0) return;

  isDrawing = true;
  stickPose = 'nervous';
  stickColor = '#facc15';
  document.getElementById('drawBtn').disabled = true;

  rollerItems = [...available];
  rollerSpeed = 15;
  rollerIndex = 0;

  playDrumRoll();

  // Phase 1: Fast spin
  const result = available[Math.floor(Math.random() * available.length)];

  await animateRoller(1500, 15);

  // Phase 2: Slow down
  stickPose = 'excited';
  await animateRoller(1500, 2, result);

  // Phase 3: Stop on result
  const resultIdx = rollerItems.indexOf(result);
  rollerIndex = resultIdx;
  rollerResult = result;

  // Reveal!
  drawnItems.push(result);
  isDrawing = false;
  stickPose = 'jump';
  stickColor = '#43e97b';

  playFanfare();
  showResult(result);
  addSparkles(stageWidth() / 2, stageHeight() / 2, 40, stageCanvas);
  launchFireworks(8);

  updateUI();
}

function animateRoller(duration, speed, target) {
  return new Promise(resolve => {
    const startTime = Date.now();
    const startIdx = rollerIndex;

    function tick() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);

      if (target && progress > 0.7) {
        // Approach target
        const targetIdx = rollerItems.indexOf(target);
        rollerIndex = targetIdx + (1 - progress) * 3;
      } else {
        rollerIndex = startIdx + elapsed * speed * 0.01;
      }

      if (Math.floor(rollerIndex) !== Math.floor(rollerIndex - 0.3)) {
        playTick();
      }

      if (progress < 1) {
        requestAnimationFrame(tick);
      } else {
        resolve();
      }
    }
    tick();
  });
}

// ============================================================
//  RESULT DISPLAY
// ============================================================
function showResult(text) {
  document.getElementById('resultText').textContent = text;
  document.getElementById('resultOverlay').classList.add('show');

  // Draw celebrating stick figure on mini canvas
  const mc = document.getElementById('miniStickCanvas');
  const mctx = mc.getContext('2d');

  let celebFrame = 0;
  function animCeleb() {
    mctx.clearRect(0, 0, mc.width, mc.height);
    drawStickFigure(mctx, mc.width / 2, mc.height / 2 + 30, 1.2, 'jump', '#ffd200');

    // Confetti
    for (let i = 0; i < 3; i++) {
      mctx.fillStyle = `hsl(${Math.random() * 360}, 80%, 60%)`;
      mctx.fillRect(
        Math.random() * mc.width,
        Math.random() * mc.height,
        4 + Math.random() * 4,
        4 + Math.random() * 4
      );
    }

    celebFrame++;
    if (celebFrame < 300) requestAnimationFrame(animCeleb);
  }
  animCeleb();
}

function closeResult() {
  document.getElementById('resultOverlay').classList.remove('show');
  stickPose = items.filter(it => !drawnItems.includes(it)).length > 0 ? 'dance' : 'idle';
  stickColor = '#fff';
}

// ============================================================
//  INIT
// ============================================================
updateUI();
</script>
</body>
</html>
